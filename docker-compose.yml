# Can Fighters — local development stack.
# Phase 0: running skeleton only. PostgreSQL is the source of truth,
# Redis backs queues/cache, Reverb serves WebSockets, Vite serves the SPA.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: can_fighters
      POSTGRES_USER: can_fighters
      POSTGRES_PASSWORD: secret
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U can_fighters"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    volumes:
      - ./apps/api:/var/www/html
    ports:
      - "8000:8000"
    # No env_file: Laravel reads apps/api/.env from the mounted volume itself.
    # Injecting it as container env vars would shadow .env.testing during tests.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - ./apps/api:/var/www/html
    depends_on:
      - api

  reverb:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./apps/api:/var/www/html
    ports:
      - "8080:8080"
    depends_on:
      - api

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      # SPA talks to the API through the Vite dev proxy (same-origin).
      VITE_API_URL: /api
      VITE_API_PROXY_TARGET: http://api:8000
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
